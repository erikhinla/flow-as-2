# ArVA client agent (arva-agent). Seeded into its own HERMES_HOME on every deploy.
# Hermes Agent v0.21.5 (image nousresearch/hermes-agent:v2026.9.24).
# The `todo` toolset is the only one enabled. On this release that toolset is the todo_list tool.
# No terminal, file, browser, computer-use, code execution, memory, web, or MCP.
model:
  provider: vertex
  default: google/gemini-2.5-flash
  max_tokens: 2048
vertex:
  region: global
platform_toolsets:
  api_server:
    - todo
  cli:
    - todo
mcp_servers: {}
