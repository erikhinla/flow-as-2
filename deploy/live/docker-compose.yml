# Client product for a live VPS: diagnostic, control plane, and operator desk.
# The agent runtimes are not part of this stack.
#
#   cp deploy/live/env.example .env
#   bash scripts/netcup/deploy.sh

services:
  flow-gateway:
    build:
      context: ../..
      dockerfile: intake-webhook/Dockerfile
    container_name: flow-gateway
    restart: unless-stopped
    environment:
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:?WEBHOOK_API_KEY must be set}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:?BIZBRAIN_API_TOKEN must be set}
      FLOW_INTAKE_URL: http://bizbrain-lite:8000/v1/intake/task
      INTAKE_DIR: /data/intake
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      DESK_PUBLIC_URL: ${DESK_PUBLIC_URL:-}
      ARVA_AGENT_URL: http://arva-agent:8642
      ARVA_API_KEY: ${ARVA_API_KEY:-}
      ARVA_SESSION_TOKEN: ${ARVA_SESSION_TOKEN:-}
      ARVA_MODEL_NAME: hermes-agent
      HANDOFF_DESK_TOKEN: ${HANDOFF_DESK_TOKEN:-}
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-}
      HERMES_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - intake_data:/data/intake
    ports:
      - "${LIVE_BIND:-0.0.0.0}:${DIAGNOSTIC_PORT:-8080}:8080"
    depends_on:
      bizbrain-lite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-internal

  bizbrain-lite:
    build:
      context: ../..
      dockerfile: services/bizbrain_lite/Dockerfile
    container_name: flow-orchestrator
    restart: unless-stopped
    environment:
      BIZBRAIN_ENV: prod
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:?BIZBRAIN_API_TOKEN must be set}
      BIZBRAIN_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://flow_user:${FLOW_DB_PASSWORD:?FLOW_DB_PASSWORD must be set}@postgres:5432/flow_agent_os
      INTAKE_RESULTS_DIR: /data/intake
      SOCIAL_HUB_API_ORIGIN: ${SOCIAL_HUB_API_ORIGIN:-http://localhost:5173}
    volumes:
      - intake_data:/data/intake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - flow-internal

  flow-dashboard:
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
    container_name: flow-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_BASIC_AUTH_USER: ${DASHBOARD_BASIC_AUTH_USER:-admin}
      DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_BASIC_AUTH_PASSWORD:?DASHBOARD_BASIC_AUTH_PASSWORD must be set}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:?BIZBRAIN_API_TOKEN must be set}
      DIAGNOSTIC_PUBLIC_URL: ${DIAGNOSTIC_PUBLIC_URL:-}
      HANDOFF_DESK_TOKEN: ${HANDOFF_DESK_TOKEN:-}
    ports:
      - "${LIVE_BIND:-0.0.0.0}:${DESK_PORT:-5173}:80"
    depends_on:
      bizbrain-lite:
        condition: service_healthy
      flow-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - flow-internal

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-internal

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:?FLOW_DB_PASSWORD must be set}
      POSTGRES_DB: flow_agent_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_user -d flow_agent_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-internal

  # ArVA: sandboxed client-facing Hermes. Internal network only, own HERMES_HOME,
  # own Vertex service account. Enabled when ARVA_API_KEY is set (profile "arva").
  arva-seed:
    image: busybox:1.36
    profiles: ["arva"]
    restart: "no"
    network_mode: none
    volumes:
      - arva_data:/opt/data
      - ./arva:/seed:ro
    command:
      - sh
      - -c
      - cp /seed/config.yaml /opt/data/config.yaml && cp /seed/SOUL.md /opt/data/SOUL.md && chown 10000:10000 /opt/data /opt/data/config.yaml /opt/data/SOUL.md && chmod 640 /opt/data/config.yaml /opt/data/SOUL.md

  arva-agent:
    # Hermes Agent v0.21.5. No ports: reachable only on flow-internal.
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: arva-agent
    profiles: ["arva"]
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${ARVA_API_KEY:-}
      API_SERVER_MODEL_NAME: hermes-agent
      VERTEX_CREDENTIALS_PATH: /run/secrets/arva-vertex-sa.json
      VERTEX_PROJECT_ID: ${ARVA_VERTEX_PROJECT_ID:-}
      VERTEX_REGION: ${ARVA_VERTEX_REGION:-global}
    volumes:
      - arva_data:/opt/data
      - ${ARVA_VERTEX_SA_FILE:-/dev/null}:/run/secrets/arva-vertex-sa.json:ro
    depends_on:
      arva-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - flow-internal

  caddy:
    image: caddy:2.8-alpine
    container_name: flow-caddy
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      DIAGNOSTIC_HOST: ${DIAGNOSTIC_HOST:-}
      DESK_HOST: ${DESK_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      flow-gateway:
        condition: service_healthy
      flow-dashboard:
        condition: service_healthy
    networks:
      - flow-internal

networks:
  flow-internal:
    name: flow-internal
    driver: bridge

volumes:
  arva_data:
  intake_data:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
